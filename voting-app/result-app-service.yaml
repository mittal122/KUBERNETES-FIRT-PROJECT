apiVersion: v1
kind: Service
metadata:
  name: result-service
  labels:
    app: demo-voting-app
    component: result
spec:
  type: NodePort
  selector:
    app: demo-voting-app
    component: result
  ports:
    - port: 80        # Port on which the service will be exposed
      targetPort: 80   # The port on the container that the service will route to
      nodePort: 30005  # Port on the nodes where the service can be accessed externally
